name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package no longer exists.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Quality checks must pass before an APK is presented as verified.
      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Assemble debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs into release/
        run: |
          set -euo pipefail
          mkdir -p release
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk release/AppRiskAuditor.apk
          cp app/build/outputs/apk/release/app-release.apk release/AppRiskAuditor-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AppRiskAuditor-apks
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
